name: azure-trading-platform

# Local development only. The credentials below are fixed on purpose: this
# database is reachable from localhost and holds nothing but simulated paper
# trades. Azure uses PostgreSQL Flexible Server with private networking and a
# password held in Key Vault, injected through a managed identity.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      BOT_DATABASE_URL: postgresql+psycopg://trading:trading@postgres:5432/trading
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
    environment:
      BOT_ENVIRONMENT: local
      BOT_DATABASE_URL: postgresql+psycopg://trading:trading@postgres:5432/trading
      BOT_EXCHANGE_BACKEND: simulated
      BOT_SYMBOL: BTC/USDT
      BOT_TIMEFRAME: 15m
      BOT_LOG_LEVEL: INFO
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# Vendored third-party artefacts are excluded from every formatting hook. They
# are shipped byte for byte as published, so rewriting them would make the file
# differ from upstream and leave the difference unexplained.
exclude: ^src/trading_bot/dashboard/static/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Run in the project virtualenv rather than an isolated one: mypy needs the
  # installed package and its typed dependencies to resolve imports, and this
  # keeps the hook and `make typecheck` from diverging.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_docs
        args: [--args=--lockfile=false]

  # checkov runs through uvx rather than the upstream hook, which expects a
  # globally installed binary. Same reasoning as the mypy hook: the local and CI
  # verdicts must come from the same invocation.
  - repo: local
    hooks:
      - id: checkov
        name: checkov
        entry: uvx --from checkov checkov --directory infra --framework terraform --compact --quiet
        language: system
        files: \.tf$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

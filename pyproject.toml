[project]
name = "trading-bot"
version = "0.1.0"
description = "Paper trading bot executed as an Azure Container Apps Job"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
exchange = ["ccxt>=4.4"]
db = ["sqlalchemy>=2.0", "alembic>=1.14", "psycopg[binary]>=3.2"]
azure = ["azure-identity>=1.19", "azure-keyvault-secrets>=4.9"]
telemetry = [
    "opentelemetry-sdk>=1.29",
    "azure-monitor-opentelemetry>=1.6",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "A",             # builtins shadowing
    "C4",            # comprehensions
    "DTZ",           # timezone-aware datetimes
    "T20",           # no print
    "SIM",           # simplify
    "ARG",           # unused arguments
    "PTH",           # pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
# NullTelemetry implements the Telemetry protocol by doing nothing. Its
# parameters exist to match the protocol, so "unused argument" is the point
# rather than a defect.
"src/trading_bot/observability/telemetry.py" = ["ARG002"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=trading_bot --cov-report=term-missing"
markers = [
    "integration: requires external services such as PostgreSQL",
]

[tool.coverage.run]
branch = true
source = ["src/trading_bot"]
